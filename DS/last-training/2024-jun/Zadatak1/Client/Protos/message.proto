syntax = "proto3";

import "google/protobuf/empty.proto";

option csharp_namespace = "Server";



service MessageServiceProto 
{
	rpc sendMessage(Message) returns (google.protobuf.Empty);
	rpc deleteMessage(MessageId) returns (Message);
	rpc listMessages(google.protobuf.Empty) returns (stream Message);
}


message Message 
{
	MessageId id = 1;
	string content = 2;
}

message MessageId 
{
	int32 val = 1;
}

